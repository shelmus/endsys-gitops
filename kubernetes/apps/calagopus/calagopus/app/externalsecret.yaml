---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Required Bitwarden secret (create in Bitwarden Secrets Manager BEFORE merging):
#   - calagopus-encryption-key: APP_ENCRYPTION_KEY (generate with `openssl rand -hex 32`)
#
# This key encrypts every secret the panel stores: node (Wings) tokens, backup
# storage credentials, OAuth secrets, users' TOTP secrets. It can't be rotated
# without re-encrypting them, so create it once and never replace it. Anyone
# holding it plus a database backup can decrypt them all; it lives only in
# Bitwarden, never next to the database backups.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calagopus-secrets
  labels:
    app.kubernetes.io/name: calagopus
    app.kubernetes.io/instance: calagopus
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: calagopus
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: calagopus-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: APP_ENCRYPTION_KEY
      remoteRef:
        key: calagopus-encryption-key

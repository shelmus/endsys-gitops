---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
# Calagopus game panel (replaces Pelican; plan: vault Plan/2026-11-10_122435-homelab-mirror-migration-plan.md
# Phase 4b). Standalone panel image: Wings stays on lyris, so the -aio image
# (bundled Wings on :2022) must NOT be used here.
#
# Route gpanel.${SECRET_DOMAIN}, internal gateway only. Merge it only AFTER the
# Pelican import (plan 4b.4): until then the panel sits at the OOBE "register"
# step and its first visitor would become admin. (games.${SECRET_DOMAIN} is the
# public game-server address, a hand-made Cloudflare A record to the WAN IP.)
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: calagopus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      calagopus:
        # DATABASE_MIGRATE=true runs migrations at startup; Recreate keeps two
        # pods from migrating the same database during an upgrade.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/calagopus/panel
              # Panel and Wings move in lockstep: read both release notes
              # before bumping (some releases need Wings first, some after).
              tag: 1.2.10@sha256:12e4460c67cdf714693a1bf022f5c384ef66f26c5893dbf44e9337f9c449e327
            env:
              TZ: America/New_York
              PORT: &port 8000
              BIND: 0.0.0.0
              APP_PRIMARY: "true"
              APP_DEBUG: "false"
              DATABASE_MIGRATE: "true"
              # Browsers talk to Wings on lyris directly, as with Pelican today.
              APP_ENABLE_WINGS_PROXY: "false"
              APP_USE_DECRYPTION_CACHE: "false"
              # Envoy's source toward pods: pod CIDR + node IPs. 1.2.10 refuses
              # to start on an invalid entry rather than dropping it.
              APP_TRUSTED_PROXIES: "10.42.0.0/16,10.127.0.0/24"
              REDIS_URL: redis://calagopus-valkey:6379
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: calagopus-postgres-app
                    key: uri
            envFrom:
              - secretRef:
                  name: calagopus-secrets
            probes:
              # /api/settings is public, local, and answers 200 JSON even at the
              # OOBE step (smoke-tested on 1.2.10, 2026-11-17).
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/settings
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 4
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/settings
                    port: *port
                  # First start applies ~150 migrations.
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi

      valkey:
        # Cache, rate limits and locks only: nothing here needs a backup.
        containers:
          app:
            image:
              repository: docker.io/valkey/valkey
              tag: 8.1-alpine@sha256:9971099af41c36e887aabdfe22b80c0fe45df949163dfc9cb434febc57cfc3fc
            args: ["valkey-server", "--save", "", "--appendonly", "no"]
            probes:
              liveness: &valkeyProbes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 6379
                  periodSeconds: 10
              readiness: *valkeyProbes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    service:
      app:
        controller: calagopus
        ports:
          http:
            port: *port
      valkey:
        controller: valkey
        ports:
          redis:
            port: 6379

    persistence:
      # Panel asset storage (uploaded icons/banners and similar). Small; Velero
      # backs it up with the namespace.
      data:
        type: persistentVolumeClaim
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        advancedMounts:
          calagopus:
            app:
              - path: /var/lib/calagopus
      tmp:
        type: emptyDir
        advancedMounts:
          calagopus:
            app:
              - path: /tmp
      valkey-data:
        type: emptyDir
        advancedMounts:
          valkey:
            app:
              - path: /data

    route:
      app:
        hostnames: ["gpanel.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port

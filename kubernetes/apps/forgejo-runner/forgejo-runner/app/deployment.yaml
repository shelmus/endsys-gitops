---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  labels:
    app.kubernetes.io/name: forgejo-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: forgejo-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forgejo-runner
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: runner
          image: code.forgejo.org/forgejo/runner:13.2.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              while ! nc -z localhost 2376 </dev/null; do echo 'waiting for docker daemon...'; sleep 5; done
              cd /data && exec forgejo-runner --config /etc/forgejo-runner/config.yml daemon
          env:
            - name: DOCKER_HOST
              value: tcp://localhost:2376
            - name: DOCKER_CERT_PATH
              value: /certs/client
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: HOME
              value: /data
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "2", memory: 2Gi }
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
              readOnly: true
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/forgejo-runner
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: { type: RuntimeDefault }
        - name: daemon
          # Privileged: Docker-in-Docker. Keep this the only privileged workload outside system namespaces.
          image: docker.io/docker:29.9.0-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "4", memory: 6Gi, ephemeral-storage: 20Gi }
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: dind-storage
              mountPath: /var/lib/docker
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: dind-storage
          emptyDir:
            sizeLimit: 20Gi
        - name: config
          secret:
            secretName: forgejo-runner-config
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: forgejo-runner-data

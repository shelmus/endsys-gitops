---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Forgejo Runner 13.x registers through `server.connections` in its config (uuid + token per
# runner, created in Forgejo at Site Administration -> Actions -> Runners -> "Create new runner").
# The whole config.yml is rendered here so the credentials never touch a ConfigMap.
# Required Bitwarden secrets:
#   - forgejo-runner-cluster-uuid         (UUID shown for the runner in the admin runner list)
#   - forgejo-runner-registration-token   (the Token shown once when the runner was created)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-runner-config
  labels:
    app.kubernetes.io/name: forgejo-runner
    app.kubernetes.io/instance: forgejo-runner
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: forgejo-runner-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yml: |
          log:
            level: info
          runner:
            file: /data/.runner
            capacity: 2
            timeout: 3h
            fetch_timeout: 5s
            fetch_interval: 2s
            # Jobs reach the DinD sidecar over TLS on the pod's localhost (network: host below).
            envs:
              DOCKER_HOST: tcp://localhost:2376
              DOCKER_CERT_PATH: /certs/client
              DOCKER_TLS_VERIFY: "1"
            labels:
              - "docker:docker://code.forgejo.org/oci/node:22-bookworm"
              - "ubuntu-latest:docker://code.forgejo.org/oci/node:22-bookworm"
          cache:
            enabled: true
            dir: /data/cache
          container:
            network: host
            privileged: false
            options: "-v /certs/client:/certs/client:ro"
            valid_volumes:
              - /certs/client
            docker_host: "-"
            force_pull: false
          host:
            workdir_parent: /data/work
          server:
            connections:
              endsys:
                url: https://code.${SECRET_DOMAIN}/
                uuid: "{{ .uuid }}"
                token: "{{ .token }}"
  data:
    - secretKey: uuid
      remoteRef:
        key: forgejo-runner-cluster-uuid
    - secretKey: token
      remoteRef:
        key: forgejo-runner-registration-token

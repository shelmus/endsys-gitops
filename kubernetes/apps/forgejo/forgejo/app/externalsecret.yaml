---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Required Bitwarden secrets:
#   - forgejo-admin-password  (openssl rand -base64 30)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: forgejo-admin
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        username: forgejo-admin
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: forgejo-admin-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Garage key for Forgejo blob storage (bucket `forgejo`, read+write, this bucket only).
# Created by scripts/forgejo-garage-keys.sh. Required Bitwarden secrets:
#   - forgejo-s3-access-key
#   - forgejo-s3-secret-key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: blob-storage-credentials
    app.kubernetes.io/part-of: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: forgejo-s3
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: MINIO_ACCESS_KEY_ID
      remoteRef:
        key: forgejo-s3-access-key
    - secretKey: MINIO_SECRET_ACCESS_KEY
      remoteRef:
        key: forgejo-s3-secret-key
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Pocket ID client "Forgejo" (callback https://code.endsys.cloud/user/oauth2/pocketid/callback,
# restricted to group code-users). The chart reads keys `key` and `secret`.
# Required Bitwarden secrets:
#   - forgejo-oidc-client-id
#   - forgejo-oidc-client-secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oauth
  labels:
    app.kubernetes.io/name: forgejo
    app.kubernetes.io/instance: forgejo
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: forgejo-oauth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: key
      remoteRef:
        key: forgejo-oidc-client-id
    - secretKey: secret
      remoteRef:
        key: forgejo-oidc-client-secret

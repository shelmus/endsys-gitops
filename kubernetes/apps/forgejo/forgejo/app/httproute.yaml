---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
spec:
  parentRefs:
    - name: external
      namespace: kube-system
      sectionName: https
  hostnames:
    - code.${SECRET_DOMAIN}
  rules:
    - backendRefs:
        - name: forgejo-http
          port: 3000

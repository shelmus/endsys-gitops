---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo-postgres
spec:
  instances: 1
  # Single instance: a PDB with minAvailable 1 blocks every node drain
  # (Talos upgrades needed --legacy). Re-enable when instances > 1.
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9
  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
  storage:
    storageClass: longhorn
    size: 5Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-forgejo-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: forgejo-objectstore

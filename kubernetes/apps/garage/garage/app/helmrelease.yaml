---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage
spec:
  interval: 30m
  chart:
    spec:
      chart: ./script/helm/garage
      sourceRef:
        kind: GitRepository
        name: garage
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      kind: StatefulSet
      replicaCount: 1
    garage:
      # Garage v2 removed `replicationMode`; use replicationFactor + consistencyMode.
      # Single-node deploy (replicaCount: 1) requires factor "1" (chart default is "3").
      replicationFactor: "1"
      consistencyMode: "consistent"
      # Metadata (LMDB) lives on the in-cluster Longhorn volume; without it the NFS data
      # blocks are unreadable. Snapshot it every 6h onto the NFS data volume (Lyris), per
      # Garage's docs ("same storage space as data_dir"). Garage keeps the 2 newest.
      # The block scanner only walks hex-named directories, so this subdir is ignored.
      # Restore: docs "Recovering from failures -> corrupted metadata", then
      # `garage repair -a --yes tables` and `garage repair -a --yes blocks`.
      metadataAutoSnapshotInterval: "6h"
      additionalTopLevelConfig: |
        metadata_snapshots_dir = "/mnt/data/metadata-snapshots"
    persistence:
      enabled: true
      meta:
        storageClass: longhorn
        size: 10Gi
      data:
        storageClass: ""
        size: 1Ti
    service:
      s3:
        api:
          port: 3900
        web:
          port: 3902
    monitoring:
      tracing:
        sink: ""
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
          interval: 30s

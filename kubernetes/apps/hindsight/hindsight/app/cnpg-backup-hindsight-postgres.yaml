---
# CNPG backups for hindsight-postgres: continuous WAL archiving + daily base backup to Garage
# bucket cnpg-hindsight via the Barman Cloud plugin. Standard: .context/database/cnpg-backup-standard.md
# Required Bitwarden secrets (create with scripts/cnpg-backup-keys.sh BEFORE merging):
#   - hindsight-cnpg-s3-access-key
#   - hindsight-cnpg-s3-secret-key
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hindsight-cnpg-s3
  labels:
    app.kubernetes.io/component: backup-storage-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hindsight-cnpg-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .accessKey }}"
        ACCESS_SECRET_KEY: "{{ .secretKey }}"
        REGION: garage
  data:
    - secretKey: accessKey
      remoteRef:
        key: hindsight-cnpg-s3-access-key
    - secretKey: secretKey
      remoteRef:
        key: hindsight-cnpg-s3-secret-key
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: hindsight-objectstore
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-hindsight/
    endpointURL: http://garage.garage.svc:3900
    s3Credentials:
      accessKeyId:
        name: hindsight-cnpg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: hindsight-cnpg-s3
        key: ACCESS_SECRET_KEY
      region:
        name: hindsight-cnpg-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Recommended by the plugin docs for S3-compatible stores (newer boto3 checksum defaults).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: hindsight-postgres-daily
spec:
  # CNPG cron has a seconds field: 03:35 UTC.
  schedule: "0 35 3 * * *"
  # immediate fires before an EXISTING cluster's restarted pod has the plugin sidecar;
  # for an existing cluster, take the first backup by hand (see the standard).
  immediate: true
  backupOwnerReference: self
  cluster:
    name: hindsight-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io

---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: hindsight-postgres
spec:
  instances: 1
  # Single instance: a PDB with minAvailable 1 blocks every node drain
  # (Talos upgrades needed --legacy). Re-enable when instances > 1.
  enablePDB: false
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  bootstrap:
    initdb:
      database: hindsight
      owner: hindsight
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    storageClass: longhorn
    size: 10Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-hindsight-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: hindsight-objectstore

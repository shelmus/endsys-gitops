---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  interval: 1h
  chart:
    spec:
      chart: home-assistant
      version: 0.3.61
      sourceRef:
        kind: HelmRepository
        name: pajikos
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      type: StatefulSet

    env:
      - name: TZ
        value: America/New_York

    hostNetwork: true
    dnsPolicy: ClusterFirstWithHostNet

    securityContext:
      privileged: true

    nodeSelector:
      kubernetes.io/hostname: kube1

    persistence:
      enabled: true
      storageClass: longhorn
      size: 10Gi

    configuration:
      enabled: true
      # One-shot force init for the reverse-proxy bootstrap rollout (PR B).
      # Reset to false in PR C so the template is not re-merged on restart.
      forceInit: true
      # Narrowed to loopback plus the Cilium native-routing / pod CIDR that the
      # internal Gateway Envoy sources from. Rendered into the http block below.
      trusted_proxies:
        - 127.0.0.0/8
        - 10.42.0.0/16
      # Chart 0.3.61 default templateConfig, with the Ingress-conditional http
      # block replaced by exactly one unconditional http mapping so the
      # standalone HTTPRoute path is trusted. Other defaults are preserved.
      templateConfig: |-
        # Loads default set of integrations. Do not remove.
        default_config:

        {{- if .Values.serviceMonitor.enabled }}
        prometheus:
        {{- end }}

        http:
          use_x_forwarded_for: true
          trusted_proxies:
            {{- range .Values.configuration.trusted_proxies }}
            - {{ . }}
            {{- end }}
        # Load frontend themes from the themes folder
        frontend:
          themes: !include_dir_merge_named themes

        automation: !include automations.yaml
        script: !include scripts.yaml
        scene: !include scenes.yaml

    # Z-wave USB passthrough disabled until device is plugged into kube1
    # additionalVolumes:
    #   - name: zwave-usb
    #     hostPath:
    #       path: /dev/serial/by-id
    #       type: Directory
    #
    # additionalMounts:
    #   - name: zwave-usb
    #     mountPath: /dev/serial/by-id
    #     readOnly: true

    service:
      type: ClusterIP
      port: 8080

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
# Scrapes every CloudNativePG instance (all namespaces) on its built-in exporter port.
# Replaces the deprecated per-Cluster `monitoring.enablePodMonitor`.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    app.kubernetes.io/component: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
      interval: 30s

---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
spec:
  interval: 1h
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.6
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    provisioner: nfs.csi.k8s.io
    controller:
      replicas: 1
    storageClass:
      # The nfs-csi class pointed at the retired homeassistant-pi (10.127.0.214).
      # No PV or PVC used it (checked 2026-11-20); Helm removes the unused class.
      create: false
      name: nfs-csi
      parameters:
        server: 10.127.0.214
        share: /srv/nfs/kube
      mountOptions:
        - nfsvers=4.1
        - hard
        - noatime
      reclaimPolicy: Retain
      volumeBindingMode: Immediate

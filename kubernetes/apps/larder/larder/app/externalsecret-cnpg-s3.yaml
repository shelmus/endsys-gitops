---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Garage S3 key for larder's CNPG backups (bucket cnpg-larder, read+write, this bucket only).
# Required Bitwarden secrets (create before merging; see .context/backup-restore.md):
#   - larder-cnpg-s3-access-key
#   - larder-cnpg-s3-secret-key
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: larder-cnpg-s3
  labels:
    app.kubernetes.io/name: larder
    app.kubernetes.io/instance: larder
    app.kubernetes.io/component: backup-storage-credentials
    app.kubernetes.io/part-of: larder
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: larder-cnpg-s3
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        ACCESS_KEY_ID: "{{ .accessKey }}"
        ACCESS_SECRET_KEY: "{{ .secretKey }}"
        REGION: garage
  data:
    - secretKey: accessKey
      remoteRef:
        key: larder-cnpg-s3-access-key
    - secretKey: secretKey
      remoteRef:
        key: larder-cnpg-s3-secret-key

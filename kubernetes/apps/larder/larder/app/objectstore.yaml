---
# Barman Cloud object store for larder-postgres: continuous WAL archiving + daily base backups
# to Garage (bucket cnpg-larder on Lyris NFS). Plugin: cnpg-system/plugin-barman-cloud.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: larder-objectstore
spec:
  retentionPolicy: "30d"
  configuration:
    destinationPath: s3://cnpg-larder/
    endpointURL: http://garage.garage.svc:3900
    s3Credentials:
      accessKeyId:
        name: larder-cnpg-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: larder-cnpg-s3
        key: ACCESS_SECRET_KEY
      region:
        name: larder-cnpg-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Recommended by the plugin docs for S3-compatible stores (newer boto3 checksum defaults).
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required

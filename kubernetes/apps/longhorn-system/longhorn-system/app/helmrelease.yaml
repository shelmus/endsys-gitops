---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  interval: 1h
  timeout: 15m
  chart:
    spec:
      chart: longhorn
      version: 1.12.1
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # defaultSettings:
      # deletingConfirmationFlag: "true"
    #   defaultDataPath: "/dev/nvme0n1"
    persistence:
      defaultClass: true
      defaultFsType: ext4
      defaultClassReplicaCount: 3
      relaimPolicy: Delete
      volumeBindingMode: "Immediate"
      # defaultDiskSelector:
      #   enable: true
      #   selector: "nvme"
    metrics:
      serviceMonitor:
        enabled: true
    # 1.12 renders internal NetworkPolicies by default (restrictInternalTraffic: true).
    # Their longhorn-manager policy admits only Longhorn pods, which would cut off the
    # Prometheus ServiceMonitor scrape. Keep pre-1.12 behaviour until metrics access
    # is added explicitly.
    networkPolicies:
      enabled: false
      restrictInternalTraffic: false

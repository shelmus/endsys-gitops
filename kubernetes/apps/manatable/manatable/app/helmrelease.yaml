---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: manatable
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      # Static client (Caddy) -- also terminates /ws and proxies it to the
      # room-server Service in-cluster, so the browser only ever talks to one
      # origin (the client resolves ws(s)://<origin>/ws at runtime).
      client:
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: ghcr.io/shelmus/manatable-client
              tag: v0.2.0
            env:
              ROOM_SERVER_UPSTREAM: manatable-room-server.manatable.svc.cluster.local:4174
            probes:
              liveness: &clientProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &clientPort 8080
                  initialDelaySeconds: 3
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *clientProbes
            securityContext: &containerSecurity
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false # Caddy writes /data and /config (owned by 10001 in the image)
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi

      # Rooms live in process memory: exactly one replica, Recreate so two
      # servers never briefly coexist and split a room across pods.
      room-server:
        strategy: Recreate
        replicas: 1
        containers:
          app:
            image:
              repository: ghcr.io/shelmus/manatable-room-server
              tag: v0.2.0
            env:
              ROOM_SERVER_PORT: &roomPort 4174
              NODE_ENV: production
            probes:
              liveness: &roomProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *roomPort
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *roomProbes
            securityContext:
              <<: *containerSecurity
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

    service:
      client:
        controller: client
        ports:
          http:
            port: *clientPort
      room-server:
        controller: room-server
        ports:
          http:
            port: *roomPort

    route:
      app:
        hostnames: ["manatable.${SECRET_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https
        rules:
          - backendRefs:
              - identifier: client
                port: *clientPort

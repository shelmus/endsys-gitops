---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app manatable
  namespace: &namespace manatable
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Stateless, no secrets, no database: nothing to depend on beyond the
  # namespace-level common component (app-template OCIRepository).
  interval: 1h
  path: ./kubernetes/apps/manatable/manatable/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false

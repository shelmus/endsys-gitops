---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-synapse-postgres
spec:
  instances: 1
  bootstrap:
    initdb:
      database: synapse
      owner: synapse
  storage:
    size: 10Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-matrix-synapse-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-synapse-objectstore
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: matrix-mas-postgres
spec:
  instances: 1
  bootstrap:
    initdb:
      database: matrix_authentication_service
      owner: mas
  storage:
    size: 5Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-matrix-mas-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: matrix-mas-objectstore

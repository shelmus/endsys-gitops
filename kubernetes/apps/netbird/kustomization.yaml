---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbird
components:
  - ../../components/common
resources:
  - ./netbird/ks.yaml
patches:
  # Pod Security: netbird-server, dashboard and ddns are non-root with ALL caps dropped;
  # CNPG satisfies baseline. Enforce baseline, warn/audit on restricted (forgejo pattern).
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Owner role for netbird-postgres. CNPG bootstraps role `netbird` with this password,
# and the same value is templated into the server config DSNs below (one source).
# Required Bitwarden secret: netbird-postgres-password (scripts/netbird-secrets.sh)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-postgres-owner
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/instance: netbird
    app.kubernetes.io/component: database-credentials
    app.kubernetes.io/part-of: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netbird-postgres-owner
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: netbird
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: netbird-postgres-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# netbird-server combined config (management + signal + relay + STUN + embedded Dex IdP).
# Schema: combined/config.yaml.example at the pinned tag (v0.80.0); shape smoke-tested
# locally against netbird-server:0.80.0 + postgres:16 (non-root, read-only rootfs).
# ${SECRET_DOMAIN} is Flux postBuild substitution; {{ .x }} is ESO templating.
# Required Bitwarden secrets (scripts/netbird-secrets.sh):
#   - netbird-relay-auth-secret     server.authSecret
#   - netbird-idp-cookie-key        server.auth.sessionCookieEncryptionKey
#   - netbird-store-encryption-key  server.store.encryptionKey (losing it = re-issue setup keys/API tokens)
#   - netbird-postgres-password     DSNs (same value as netbird-postgres-owner)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-server-config
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/instance: netbird
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netbird-server-config
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        config.yaml: |
          server:
            # Plain HTTP + h2c behind the Cilium Gateway (TLS terminates there).
            # 8080, not upstream's 80: the pod runs non-root without NET_BIND_SERVICE.
            listenAddress: ":8080"
            exposedAddress: "https://netbird.${SECRET_DOMAIN}:443"
            stunPorts:
              - 3478
            metricsPort: 9090
            # /health dials the public relay URL (wss://netbird.${SECRET_DOMAIN}) and reports 503
            # until it is reachable, so it is NOT used for kubelet probes (circular with readiness).
            healthcheckAddress: ":9000"
            logLevel: "info"
            logFile: "console"
            authSecret: "{{ .relayAuthSecret }}"
            dataDir: "/var/lib/netbird/"
            disableAnonymousMetrics: true
            auth:
              issuer: "https://netbird.${SECRET_DOMAIN}/oauth2"
              # Keep the local owner account as break-glass next to the Pocket ID connector.
              localAuthDisabled: false
              signKeyRefreshEnabled: true
              sessionCookieEncryptionKey: "{{ .idpCookieKey }}"
              dashboardRedirectURIs:
                - "https://netbird.${SECRET_DOMAIN}/nb-auth"
                - "https://netbird.${SECRET_DOMAIN}/nb-silent-auth"
              dashboardPostLogoutRedirectURIs:
                - "https://netbird.${SECRET_DOMAIN}/"
              cliRedirectURIs:
                - "http://localhost:53000/"
            store:
              engine: "postgres"
              dsn: "host=netbird-postgres-rw.netbird.svc user=netbird password={{ .pgPassword }} dbname=netbird port=5432 sslmode=require"
              encryptionKey: "{{ .storeEncryptionKey }}"
            activityStore:
              engine: "postgres"
              dsn: "host=netbird-postgres-rw.netbird.svc user=netbird password={{ .pgPassword }} dbname=netbird_events port=5432 sslmode=require"
            authStore:
              engine: "postgres"
              dsn: "host=netbird-postgres-rw.netbird.svc user=netbird password={{ .pgPassword }} dbname=netbird_idp port=5432 sslmode=require"
            reverseProxy:
              # Sources allowed to set X-Forwarded-For. Unset = 0.0.0.0/0 (server warns: IP spoofing).
              # Cilium's Envoy reaches pods from the pod CIDR (cilium_host ingress IP) or a node IP.
              # VERIFY after deploy (plan Task 2.10): access log must show real client IPs.
              trustedPeers:
                - "10.42.0.0/16"
                - "10.127.0.41/32"
                - "10.127.0.42/32"
                - "10.127.0.43/32"
              trustedHTTPProxies:
                - "10.42.0.0/16"
                - "10.127.0.41/32"
                - "10.127.0.42/32"
                - "10.127.0.43/32"
  data:
    - secretKey: relayAuthSecret
      remoteRef:
        key: netbird-relay-auth-secret
    - secretKey: idpCookieKey
      remoteRef:
        key: netbird-idp-cookie-key
    - secretKey: storeEncryptionKey
      remoteRef:
        key: netbird-store-encryption-key
    - secretKey: pgPassword
      remoteRef:
        key: netbird-postgres-password
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
# Cloudflare token for the DDNS updater that owns netbird.${SECRET_DOMAIN} (DNS-only, not proxied:
# NetBird needs UDP 3478 and long-lived gRPC, which Cloudflare's proxy can't carry).
# Required Bitwarden secret: netbird-ddns-cloudflare-token (Zone:DNS:Edit on the zone, no IP filter)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netbird-ddns
  labels:
    app.kubernetes.io/name: netbird
    app.kubernetes.io/instance: netbird
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: netbird
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netbird-ddns
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: netbird-ddns-cloudflare-token

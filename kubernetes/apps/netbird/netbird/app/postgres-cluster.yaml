---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbird-postgres
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.9
  bootstrap:
    initdb:
      database: netbird
      owner: netbird
      # Bitwarden-sourced owner password (not the CNPG-generated -app secret), so the
      # server config DSNs and the role share one source of truth.
      secret:
        name: netbird-postgres-owner
  storage:
    storageClass: longhorn
    size: 5Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-netbird-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: netbird-objectstore
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
# NetBird keeps activity events and the embedded IdP (Dex) in their own databases.
# Declarative CNPG Database (operator 1.30.1) instead of one-shot postInitSQL, so they are
# reconciled if missing. Reclaim policy retain: deleting this object never drops data.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-events
spec:
  name: netbird_events
  owner: netbird
  cluster:
    name: netbird-postgres
  databaseReclaimPolicy: retain
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: netbird-idp
spec:
  name: netbird_idp
  owner: netbird
  cluster:
    name: netbird-postgres
  databaseReclaimPolicy: retain

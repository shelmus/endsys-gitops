---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/ocirepository-source-v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.7.2
  url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Helm's 3-way merge patch keys Service ports on `port` and container ports
  # on `containerPort`, so the 53/TCP and 1053/TCP entries `useTcp` added in
  # #309 collided with the existing UDP ones and never reached the live objects
  # (Service stayed UDP-only; Cilium dropped every TCP query as "Service backend
  # not found"). Drift correction server-side-applies the rendered manifest,
  # which keys ports on (port, protocol), and keeps them from regressing again.
  driftDetection:
    mode: enabled
  # Pin both node ports. The chart only renders nodePort for type NodePort, so
  # the dns-tcp entry arrived without one; drift correction then sent the
  # API server's dry-run placeholder (32769, outside 30000-32767) and every
  # patch was rejected. dns-udp keeps its allocated 30503; dns-tcp gets 30053.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: k8s-gateway
            patch: |
              - op: add
                path: /spec/ports/0/nodePort
                value: 30503
              - op: add
                path: /spec/ports/1/nodePort
                value: 30053
  values:
    fullnameOverride: k8s-gateway
    domain: "${SECRET_DOMAIN}"
    ttl: 1
    service:
      type: LoadBalancer
      port: 53
      # DNS over TCP is not optional here. Chart 3.7.2 gates BOTH the container
      # port and the Service port behind `useTcp` (default false), so without
      # this the LoadBalancer only publishes 53/UDP and every TCP query — a
      # truncated-response retry, a resolver that forces TCP, `dig +tcp` — just
      # times out. That becomes load-bearing once UniFi is the household
      # resolver and conditionally forwards endsys.cloud to this address.
      useTcp: true
      annotations:
        lbipam.cilium.io/ips: "10.127.0.50"
      externalTrafficPolicy: Cluster
    watchedResources: ["HTTPRoute", "Service"]

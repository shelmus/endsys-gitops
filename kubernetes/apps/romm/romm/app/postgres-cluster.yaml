---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: romm-postgres
spec:
  instances: 1
  bootstrap:
    initdb:
      database: romm
      owner: romm
  storage:
    size: 10Gi
  # WAL archiving + base backups via the Barman Cloud plugin (see cnpg-backup-romm-postgres.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: romm-objectstore

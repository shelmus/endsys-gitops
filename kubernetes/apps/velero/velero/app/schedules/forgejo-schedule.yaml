---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: forgejo-daily
  namespace: velero
  labels:
    app.kubernetes.io/name: velero
    app.kubernetes.io/component: backup-schedule
    app.kubernetes.io/part-of: forgejo
spec:
  # 02:30 UTC: free slot between larder (02:25) and romm (02:45).
  # Covers the forgejo-data PVC (repositories + app.ini with the chart-generated secrets).
  # Postgres is covered by CNPG/Barman Cloud, not by this schedule.
  schedule: "30 2 * * *"
  template:
    includedNamespaces:
      - forgejo
    includedResources:
      - '*'
    defaultVolumesToFsBackup: true
    storageLocation: default
    ttl: 720h0m0s
    includeClusterResources: true
    metadata:
      labels:
        app.kubernetes.io/name: forgejo
        backup-type: scheduled
  useOwnerReferencesInBackup: false
